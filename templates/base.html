<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Getränkeliste{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" type="image/png" href="/static/favicon.ico" />
    <!-- GitHub Icon -->
    <style>
        .github-icon-link {
            position: absolute;
            top: 16px;
            right: 16px;
            display: inline-block;
        }
        .github-icon-link svg {
            width: 32px;
            height: 32px;
            fill: #181717;
            transition: fill 0.2s;
        }
        .github-icon-link:hover svg {
            fill: #0366d6;
        }
    </style>
    <a class="github-icon-link" href="https://git.fs.cs.uni-frankfurt.de/Fachschaft/GetraenkelisteWebsite" target="_blank" title="Gitea" rel="noopener">
        <img
            src="/static/gitea.svg"
            alt="Gitea Logo"
            height="64"
            width="64"
        />
    </a>
</head>
<body>
    <header>
        <img src="/static/fachschaftslogo.png" alt="Logo" style="height: 50px; vertical-align: middle" />
        <h1>Getränkeliste</h1>
        {% if user %}
            <p>
                Angemeldet als {{ user.preferred_username }}{% if 'Getraenkeliste Verantwortliche' in user.groups %} (Admin){% endif %} –
                <a href="/logout">Logout</a>
            </p>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
